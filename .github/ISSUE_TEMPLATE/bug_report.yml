name: Bug report
description: Report a reproducible Codex Galaxy problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Never paste API keys, OAuth tokens, auth.json, browser cookies, or complete private chat histories.
  - type: input
    id: galaxy-version
    attributes:
      label: Codex Galaxy version
      placeholder: 1.4.0
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex Desktop or CLI version
      placeholder: Codex Desktop version or codex-cli --version
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS Apple Silicon
        - macOS Intel
        - Other
    validations:
      required: true
  - type: dropdown
    id: profile-path
    attributes:
      label: Switching path
      options:
        - API to API
        - API to official
        - Official to API
        - Official to official
        - Startup or restart
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select...
        2. Click...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted error
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed API keys, tokens, account identifiers, private chat content, and sensitive paths.
          required: true
