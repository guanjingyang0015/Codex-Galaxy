name: Build desktop installers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    name: Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: codex-galaxy-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npx electron-builder --mac dmg --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: codex-galaxy-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
