name: Build desktop installers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm test

  windows:
    name: Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: codex-galaxy-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: codex-galaxy-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify release tag
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw new Error('Tag does not match package version')"
      - uses: actions/download-artifact@v8
        with:
          pattern: codex-galaxy-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 files
        shell: bash
        run: |
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' \) -print0 |
          while IFS= read -r -d '' file; do
            (
              cd "$(dirname "$file")"
              sha256sum "$(basename "$file")" > "$(basename "$file").sha256"
            )
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "Codex Galaxy ${GITHUB_REF_NAME#v}" --notes-file "release-notes/${GITHUB_REF_NAME}.md"
