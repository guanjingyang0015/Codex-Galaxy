server {
    listen 80;
    server_name api.vx314490015.cn;

    client_max_body_size 64k;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;

    location / {
        proxy_pass http://127.0.0.1:18110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.vx314490015.cn;

    ssl_certificate /opt/codex-galaxy-relay-rank/shared/ssl/api.vx314490015.cn.fullchain.crt;
    ssl_certificate_key /opt/codex-galaxy-relay-rank/shared/ssl/api.vx314490015.cn.key;

    client_max_body_size 64k;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;

    location / {
        proxy_pass http://127.0.0.1:18110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
