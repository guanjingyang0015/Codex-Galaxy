<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <style>
    :root { background: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; -webkit-app-region: no-drag; }
    .badge { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 10px; border: 1px solid rgba(122, 220, 180, .8); border-radius: 999px; background: rgba(20, 45, 38, .94); box-shadow: 0 3px 12px rgba(0, 0, 0, .24); color: #9ae8c5; font-size: 11px; font-weight: 700; letter-spacing: .1px; white-space: nowrap; }
    .badge strong { margin-left: 4px; color: #f3fff9; font-weight: 800; }
  </style>
</head>
<body>
  <div class="badge">Codex Galaxy <strong id="version">0.0.0</strong></div>
</body>
</html>
